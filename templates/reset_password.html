{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card p-4">
      <h3>Choose a new password</h3>
      <form method="post">
        <div class="mb-3"><label>New password</label><input class="form-control" type="password" name="password" required /></div>
        <button class="btn btn-primary w-100">Reset password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
